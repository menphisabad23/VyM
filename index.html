<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V+M</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 20px;
  }

  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    transition: background-image 0.7s ease;
    z-index: 1;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.65), rgba(0,0,0,0.3));
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(92%, 580px);
    padding: 36px 28px;
    border-radius: 24px;
    background: rgba(15, 15, 15, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .small {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 14px;
    line-height: 1.25;
  }

  .subtitle {
    line-height: 1.6;
    opacity: 0.9;
    margin-bottom: 25px;
    font-size: 15px;
  }

  .progress {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: #fff;
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  h2 {
    font-size: 22px;
    line-height: 1.35;
    margin-bottom: 22px;
  }

  .options {
    width: 100%;
    display: grid;
    gap: 12px;
  }

  .option {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    padding: 16px 18px;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .option:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
  }

  .result {
    line-height: 1.65;
  }

  .result h2 {
    font-size: 26px;
    margin-bottom: 14px;
  }

  .result p {
    font-size: 16px;
    margin-bottom: 20px;
  }

  .reveal {
    margin-top: 15px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.12);
    font-size: 15px;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 500px) {
    .card {
      padding: 28px 18px;
    }
    h1 { font-size: 25px; }
    h2 { font-size: 19px; }
    .option { font-size: 15px; padding: 14px; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <main class="card">
    <!-- Intro -->
    <section id="intro">
      <div class="small">Una pequeña elección</div>
      <h1>¿Qué tipo de tarde te representa?</h1>
      <p class="subtitle">Son solo unas preguntas. No hay respuestas correctas. Elige lo primero que te nazca.</p>
      <button class="option" onclick="start()">Comenzar</button>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="hidden">
      <div class="progress"><span id="bar"></span></div>
      <div class="small" id="counter"></div>
